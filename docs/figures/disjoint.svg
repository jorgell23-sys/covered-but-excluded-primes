<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="100%" role="img" aria-label="The two disjoint sets of primes"><style>
  :root{--ink:#16202b;--soft:#5a6a7a;--line:#c3ced9;--bg:#ffffff;
        --good:#1d7a53;--bad:#b3402a;--mid:#2f6ea8}
  @media (prefers-color-scheme: dark){
   :root{--ink:#e6edf4;--soft:#9fb0c0;--line:#3d4a58;--bg:#0f1720;
         --good:#4fbf8b;--bad:#e0755c;--mid:#67a6dd}}
  text{font-family:ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif}
  .t{fill:var(--ink)} .s{fill:var(--soft)} .ln{stroke:var(--line);fill:none}
</style>
<rect width="720" height="330" fill="var(--bg)"/>
<text x="20" y="30" class="t" font-size="17" font-weight="600">f(q^e) = q^2e - q^e + 1 : the prime 3 is covered and divides nothing</text>
<text x="20" y="58" class="s" font-size="13">primes that CAN point at 3 (q = 2 mod 3)</text>
<rect x="20" y="70" width="40" height="28" rx="6" fill="none" stroke="var(--bad)"/><text x="40" y="89" class="t" font-size="13" text-anchor="middle">5</text>
<rect x="66" y="70" width="40" height="28" rx="6" fill="none" stroke="var(--bad)"/><text x="86" y="89" class="t" font-size="13" text-anchor="middle">11</text>
<rect x="112" y="70" width="40" height="28" rx="6" fill="none" stroke="var(--bad)"/><text x="132" y="89" class="t" font-size="13" text-anchor="middle">17</text>
<rect x="158" y="70" width="40" height="28" rx="6" fill="none" stroke="var(--bad)"/><text x="178" y="89" class="t" font-size="13" text-anchor="middle">23</text>
<rect x="204" y="70" width="40" height="28" rx="6" fill="none" stroke="var(--bad)"/><text x="224" y="89" class="t" font-size="13" text-anchor="middle">29</text>
<rect x="250" y="70" width="40" height="28" rx="6" fill="none" stroke="var(--bad)"/><text x="270" y="89" class="t" font-size="13" text-anchor="middle">41</text>
<rect x="296" y="70" width="40" height="28" rx="6" fill="none" stroke="var(--bad)"/><text x="316" y="89" class="t" font-size="13" text-anchor="middle">47</text>
<rect x="342" y="70" width="40" height="28" rx="6" fill="none" stroke="var(--bad)"/><text x="362" y="89" class="t" font-size="13" text-anchor="middle">53</text>
<rect x="388" y="70" width="40" height="28" rx="6" fill="none" stroke="var(--bad)"/><text x="408" y="89" class="t" font-size="13" text-anchor="middle">59</text>
<rect x="434" y="70" width="40" height="28" rx="6" fill="none" stroke="var(--bad)"/><text x="454" y="89" class="t" font-size="13" text-anchor="middle">71</text>
<rect x="480" y="70" width="40" height="28" rx="6" fill="none" stroke="var(--bad)"/><text x="500" y="89" class="t" font-size="13" text-anchor="middle">83</text>
<rect x="526" y="70" width="40" height="28" rx="6" fill="none" stroke="var(--bad)"/><text x="546" y="89" class="t" font-size="13" text-anchor="middle">89</text>
<rect x="572" y="70" width="40" height="28" rx="6" fill="none" stroke="var(--bad)"/><text x="592" y="89" class="t" font-size="13" text-anchor="middle">101</text>
<rect x="618" y="70" width="40" height="28" rx="6" fill="none" stroke="var(--bad)"/><text x="638" y="89" class="t" font-size="13" text-anchor="middle">107</text>
<text x="20" y="132" class="s" font-size="13">primes that are themselves covered (p = 1 mod 6)</text>
<rect x="20" y="144" width="40" height="28" rx="6" fill="none" stroke="var(--good)"/><text x="40" y="163" class="t" font-size="13" text-anchor="middle">7</text>
<rect x="66" y="144" width="40" height="28" rx="6" fill="none" stroke="var(--good)"/><text x="86" y="163" class="t" font-size="13" text-anchor="middle">13</text>
<rect x="112" y="144" width="40" height="28" rx="6" fill="none" stroke="var(--good)"/><text x="132" y="163" class="t" font-size="13" text-anchor="middle">19</text>
<rect x="158" y="144" width="40" height="28" rx="6" fill="none" stroke="var(--good)"/><text x="178" y="163" class="t" font-size="13" text-anchor="middle">31</text>
<rect x="204" y="144" width="40" height="28" rx="6" fill="none" stroke="var(--good)"/><text x="224" y="163" class="t" font-size="13" text-anchor="middle">37</text>
<rect x="250" y="144" width="40" height="28" rx="6" fill="none" stroke="var(--good)"/><text x="270" y="163" class="t" font-size="13" text-anchor="middle">43</text>
<rect x="296" y="144" width="40" height="28" rx="6" fill="none" stroke="var(--good)"/><text x="316" y="163" class="t" font-size="13" text-anchor="middle">61</text>
<rect x="342" y="144" width="40" height="28" rx="6" fill="none" stroke="var(--good)"/><text x="362" y="163" class="t" font-size="13" text-anchor="middle">67</text>
<rect x="388" y="144" width="40" height="28" rx="6" fill="none" stroke="var(--good)"/><text x="408" y="163" class="t" font-size="13" text-anchor="middle">73</text>
<rect x="434" y="144" width="40" height="28" rx="6" fill="none" stroke="var(--good)"/><text x="454" y="163" class="t" font-size="13" text-anchor="middle">79</text>
<rect x="480" y="144" width="40" height="28" rx="6" fill="none" stroke="var(--good)"/><text x="500" y="163" class="t" font-size="13" text-anchor="middle">97</text>
<rect x="526" y="144" width="40" height="28" rx="6" fill="none" stroke="var(--good)"/><text x="546" y="163" class="t" font-size="13" text-anchor="middle">103</text>
<rect x="572" y="144" width="40" height="28" rx="6" fill="none" stroke="var(--good)"/><text x="592" y="163" class="t" font-size="13" text-anchor="middle">109</text>
<line x1="20" y1="200" x2="700" y2="200" class="ln" stroke-dasharray="4 4"/>
<text x="20" y="228" class="t" font-size="14">The two rows share no prime. Every arrow into 3 starts in the top row,</text>
<text x="20" y="250" class="t" font-size="14">and no number of S(f) may contain a prime from the top row.</text>
<text x="20" y="286" class="s" font-size="13">so 3 has arrows coming in, and still divides no element of S(f) = { n : rad(n) | f(n) }.</text>
<text x="20" y="310" class="s" font-size="12">3 is the prime where x^2 - x + 1 = (x+1)^2 mod 3 has a repeated root: the ramified prime.</text>
</svg>
